voice:
  lines:
  - Types of kurtis every woman should know!
  - Straight cut. Clean and simple. Goes with everything.
  - A-line. Fitted on top, flares gently at the bottom.
  - Empire. The seam sits just under the bust, then flows down.
  - Kaftan. Loose, breezy, and so comfortable.
  - Shirt style. A collar and buttons. Smart for office.
  - High-low. Short in front, long at the back.
  - Front slit. One long slit in the front. Very chic.
  - Peplum. Fitted at the waist, with a flare at the hips.
  - Asymmetric. A slanting hem, full of style.
  - And the royal one... the Kalidar! Many panels, full of grace.
  style: A cheerful, warm young Indian woman fashion creator with a natural Indian English accent, talking to her Instagram
    followers like a friendly big sister. Bright and upbeat but clear and easy to understand, say each kurti name with a little
    emphasis and a tiny pause after it, and proud and dramatic on the finale.
  ending_text: So many options... so which one is actually right for you? ... Not every style flatters every body type. To
    know what suits you...
  ending_style: A warm young Indian woman fashion creator with a natural Indian English accent. Start a little overwhelmed
    and playfully confused, like there are too many choices, then pause, and become sincere and caring, as if sharing a secret.
    In the final phrase, say 'To know' clearly as two words, starting with a crisp T, as a statement (not a question), trailing
    off with gentle curiosity.
