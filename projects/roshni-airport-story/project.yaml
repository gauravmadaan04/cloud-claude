voice:
  lines:
  - This is Roshni. Today, she is flying to a new city.
  - The airport is busy. Everyone is rushing. But Roshni is calm.
  - Then... her plane leaves without her! Does she cry? No. She smiles. There is always another flight.
  - Others drag heavy bags. Roshni carries just one small bag. A light bag. A light heart.
  - She buys a coffee and laughs. Small joys make big days.
  - An old uncle drops his ticket. Roshni gives it back. Now two people are smiling.
  - Soon, a new gate opens. Her gate. And Roshni is ready.
  - Because when life changes your flight... just walk like the runway is yours.
  joiner: ' <long pause> '
  style: 'A warm, expressive storyteller: a young Indian woman with a soft Indian English accent, telling a short story the
    way you read to children and grandparents. Slow, clear and gentle, with a smile in the voice, a playful gasp on ''Oh''
    moments, a little suspense before ''her plane leaves without her'', and quiet confidence on the last line.'
images:
  refs: [refs/r1_face.jpg, refs/r2_full.jpg, refs/r3_rust.jpg]
  resolution: 2K
  aspect: '9:16'
  prefix: 'Use the woman in the reference photos as the only main character: keep her exact face, eyes, eyebrows, nose with
    small nose pin, smile, skin tone and long dark wavy hair so she is clearly the same person. She wears a chic travel look:
    a camel wool trench coat worn open, a fitted rust-brown ribbed henley top with small silver buttons, high-waisted wide-leg
    light-blue jeans, red pointed-toe flats, small gold hoop earrings and a slim gold watch. '
  suffix: . Photorealistic luxury fashion editorial, shot on 35mm cinema camera, natural skin texture, soft warm cinematic
    light, colour palette of warm neutrals with rust and red accents, modern minimalist international airport terminal. Vertical
    9:16 frame. No text, no logos, no watermark.
  shots:
    s1_hero_walk: 'Wide symmetrical shot: she walks confidently towards the camera down the centre of a vast, sunlit airport
      terminal with floor-to-ceiling glass windows and an aircraft visible outside, pulling a small tan leather carry-on,
      tortoiseshell sunglasses on, slight smile. Lots of open space above her'
    s2_crowd: She stands still and calm in the middle of a busy airport hall, looking straight at the camera with a soft smile,
      hands in coat pockets, while travellers rush past her on both sides as motion-blurred silhouettes. A large departures
      board glows softly behind her, out of focus
    s3_window: Golden hour. She stands at a giant airport window seen from a three-quarter back angle, holding a takeaway
      coffee cup, watching a passenger jet take off over the runway outside. Warm sunset light rims her hair. Calm, peaceful
      mood
    s4_light_bags: 'Low-angle side shot at floor level: her red pointed flats and wide-leg jeans striding past a big pile
      of heavy, overstuffed suitcases on a luggage trolley, while she pulls only her one small tan leather carry-on. Shallow
      depth of field, polished reflective floor'
    s5_happy: 'Medium close-up: she laughs freely, head tilted back slightly, holding a takeaway coffee cup in one hand and
      her passport with a boarding pass in the other, sunglasses pushed up on her head. Warm bokeh airport lights behind her'
    s6_kind: She kindly bends down and hands a dropped boarding pass back to a smiling elderly Indian man with grey hair and
      a walking stick, both smiling warmly at each other in a bright airport corridor. Heartwarming, gentle moment
    s7_gate: She rises from a seat at the departure gate, picking up her tan carry-on, confident smile, as a large overhead
      gate sign glows behind her. Big windows with a parked aircraft at the jet bridge. Clean, hopeful morning light
    s8_runway: 'Hero shot from a low angle: she power-walks straight towards the camera along a long glowing airport corridor
      like a fashion model on a runway, trench coat flowing behind her, sunglasses on, chin up, carry-on rolling beside her.
      Strong leading lines, dramatic warm backlight'
    s9_look_back: At the doorway of the jet bridge leading to the aircraft, she looks back over her shoulder at the camera
      with a confident, warm smile, one hand on the carry-on handle. Soft daylight from the aircraft door
    n1_arrive: She steps out of a taxi at the glass entrance of a grand modern airport terminal in soft morning light, sunglasses
      pushed up on her head, holding her passport, looking up at the building with an excited, happy smile, small tan carry-on
      beside her
    n2_window_smile: 'Close-up at a giant airport window at golden hour: she turns towards the camera with a big, warm, carefree
      smile, holding a takeaway coffee cup, while a passenger jet climbs into the orange sunset sky behind her through the
      glass'
