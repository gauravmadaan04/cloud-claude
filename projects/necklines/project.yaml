voice:
  lines:
  - Types of necklines every woman should know!
  - Round neck. Simple, classic, and so easy.
  - V-neck. Makes your neck look longer.
  - Scoop. A soft, deep curve. Very feminine.
  - Boat neck. Wide and straight, from shoulder to shoulder.
  - Square. Straight lines with a clean, modern look.
  - Sweetheart. Curved like the top of a heart.
  - Collar. Smart and crisp, just like a shirt.
  - Cowl. Soft fabric that drapes in folds.
  - Off-shoulder. Shows off your shoulders. Party ready!
  - And the classy one... the high neck! Covered, chic, and so elegant.
  style: A cheerful, warm young Indian woman fashion creator with a natural Indian English accent, talking to her Instagram
    followers like a friendly big sister. Bright and upbeat but clear and easy to understand, say each neckline name with
    a little emphasis and a tiny pause after it, and proud and dramatic on the finale.
  ending_text: So many options... so which one is actually right for you? ... Your face shape decides which neckline suits
    you. To know what suits you...
  ending_style: A warm young Indian woman fashion creator with a natural Indian English accent. Start a little overwhelmed
    and playfully confused, like there are too many choices, then pause, and become sincere and caring, as if sharing a secret.
    In the final phrase, say 'To know' clearly as two words, starting with a crisp T, as a statement (not a question), trailing
    off with gentle curiosity.
