name: Haven macOS

on:
  push:
    branches: [haven-mac]
  workflow_dispatch:

concurrency:
  group: haven-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      DD: build/dd
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Core logic tests (HavenCore)
        run: |
          set -o pipefail
          cd Packages/HavenCore && swift test 2>&1 | tee "$GITHUB_WORKSPACE/core.log" | grep -E "error:|failed|Executed .* tests" | tail -40

      - name: Speed on 300,000 files (HavenCore, release build)
        continue-on-error: true
        run: |
          set -o pipefail
          cd Packages/HavenCore && HAVEN_BENCH=1 swift test -c release --filter PerformanceTests 2>&1 \
            | grep -E "BENCH|Executed|error" | tee "$GITHUB_WORKSPACE/bench.log"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app and tests (Debug)
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Haven.xcodeproj -scheme Haven -destination 'platform=macOS' \
            -derivedDataPath "$DD" CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES 2>&1 | tee build-debug.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "TEST BUILD SUCCEEDED\|BUILD SUCCEEDED" build-debug.log

      - name: Compiler errors
        if: failure()
        run: grep -E "error:" build-debug.log | sort -u | head -150 || true

      - name: Allow UI automation
        run: sudo automationmodetool enable-automationmode-without-authentication || true

      - name: Integration tests (OCR, PDFs, metadata, duplicates, trash/undo)
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Haven.xcodeproj -scheme Haven -destination 'platform=macOS' \
            -derivedDataPath "$DD" -only-testing:HavenTests -resultBundlePath build/UnitTests.xcresult 2>&1 \
            | tee unit.log | grep -E "Test Case|error:|passed|failed|Executed|OCR|distance" | tail -120

      - name: UI tests (end to end, with screenshots)
        id: ui
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Haven.xcodeproj -scheme Haven -destination 'platform=macOS' \
            -derivedDataPath "$DD" -only-testing:HavenUITests -resultBundlePath build/UITests.xcresult 2>&1 \
            | tee ui.log | grep -E "Test Case|error:|passed|failed|Executed|XCTAssert" | tail -150

      - name: Collect crash reports
        if: always()
        continue-on-error: true
        run: |
          mkdir -p crashes
          cp ~/Library/Logs/DiagnosticReports/Haven*.ips crashes/ 2>/dev/null || true
          for f in crashes/*.ips; do
            [ -f "$f" ] || continue
            echo "== $f"
            python3 - "$f" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read().split("\n", 1)
          body = json.loads(raw[1]) if len(raw) > 1 else {}
          print("exception:", body.get("exception"), body.get("termination", {}).get("indicator"))
          ft = body.get("faultingThread", 0)
          images = body.get("usedImages", [])
          for fr in body.get("threads", [])[ft].get("frames", [])[:25]:
              img = images[fr.get("imageIndex", 0)].get("name", "?") if images else "?"
              print("  ", img, fr.get("symbol", "?"), fr.get("sourceFile", ""), fr.get("sourceLine", ""))
          PY
          done

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots >/dev/null 2>&1 || true
          python3 - <<'PY'
          import json, os, shutil
          d = "build/screenshots"
          out = os.path.join(d, "named")
          os.makedirs(out, exist_ok=True)
          try:
              manifest = json.load(open(os.path.join(d, "manifest.json")))
          except Exception:
              manifest = []
          def walk(x):
              if isinstance(x, dict):
                  if "exportedFileName" in x and "suggestedHumanReadableName" in x:
                      yield x
                  for v in x.values():
                      yield from walk(v)
              elif isinstance(x, list):
                  for v in x:
                      yield from walk(v)
          for a in walk(manifest):
              src = os.path.join(d, a["exportedFileName"])
              if src.endswith(".png") and os.path.exists(src):
                  name = a["suggestedHumanReadableName"].split("_0_")[0]
                  shutil.copy(src, os.path.join(out, name + ".png"))
          PY
          ls build/screenshots/named | head -80

      - name: Build release (Apple silicon + Intel)
        run: |
          set -o pipefail
          xcodebuild -project Haven.xcodeproj -scheme Haven -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/rel ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY=- build 2>&1 \
            | tee build-release.log | grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" || true
          grep -q "BUILD SUCCEEDED" build-release.log

      - name: Sign (ad hoc) and check the app
        run: |
          APP=build/rel/Build/Products/Release/Haven.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/Haven"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          ls "$APP/Contents/Resources"
          du -sh "$APP"

      - name: Smoke test the release build
        run: |
          APP=build/rel/Build/Products/Release/Haven.app
          mkdir -p /private/tmp/haven-smoke/Downloads
          "$APP/Contents/MacOS/Haven" -HavenFixtureRoot /private/tmp/haven-smoke -HavenSkipOnboarding YES -HavenResetState YES &
          PID=$!
          sleep 12
          if kill -0 $PID 2>/dev/null; then echo "Release app is running fine"; kill $PID; else echo "Release app exited early"; exit 1; fi

      - name: Package DMG
        run: |
          scripts/build_dmg.sh build/rel/Build/Products/Release/Haven.app build/Haven-1.0.0.dmg
          hdiutil verify build/Haven-1.0.0.dmg
          MNT=$(mktemp -d)
          hdiutil attach build/Haven-1.0.0.dmg -nobrowse -readonly -mountpoint "$MNT"
          ls -la "$MNT"
          codesign --verify --deep --strict "$MNT/Haven.app"
          hdiutil detach "$MNT"
          shasum -a 256 build/Haven-1.0.0.dmg | tee build/Haven-1.0.0.dmg.sha256
          ls -lh build/Haven-1.0.0.dmg

      - name: Screenshot the installer window (best effort)
        continue-on-error: true
        run: |
          hdiutil attach build/Haven-1.0.0.dmg -readonly
          sleep 2
          open /Volumes/Haven
          sleep 5
          mkdir -p build/screenshots/named
          screencapture -x build/screenshots/named/90-dmg-window.png || true
          osascript -e 'tell application "Finder" to close every window' || true
          # Again with hidden files shown (⌘⇧.): the background picture and disk icon must stay out of view.
          defaults write com.apple.finder AppleShowAllFiles -bool true
          killall Finder || true
          sleep 4
          open /Volumes/Haven
          sleep 5
          screencapture -x build/screenshots/named/91-dmg-window-hidden-files.png || true
          osascript -e 'tell application "Finder" to close every window' || true
          defaults write com.apple.finder AppleShowAllFiles -bool false
          killall Finder || true
          hdiutil detach /Volumes/Haven || true
          ls -la build/Haven-1.0.0.dmg
          APP=build/rel/Build/Products/Release/Haven.app
          ls "$APP/Contents/Resources" | grep -i appintents || echo "no App Intents metadata"

      - uses: actions/upload-artifact@v4
        with:
          name: Haven-dmg
          path: |
            build/Haven-1.0.0.dmg
            build/Haven-1.0.0.dmg.sha256
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/screenshots/named
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            core.log
            unit.log
            ui.log
            bench.log
            build-debug.log
            crashes
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: steps.unit.outcome == 'failure' || steps.ui.outcome == 'failure'
        run: |
          echo "Unit: ${{ steps.unit.outcome }}  UI: ${{ steps.ui.outcome }}"
          grep -E "error:|failed" unit.log ui.log | head -80 || true
          exit 1
