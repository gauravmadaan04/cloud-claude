name: Ribbon macOS app

on:
  push:
    branches: ['claude/ribbon-mac-wm']
    paths: ['apps/ribbon/**', '.github/workflows/ribbon.yml']
  workflow_dispatch:

concurrency:
  group: ribbon-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: apps/ribbon
    steps:
      - uses: actions/checkout@v4

      - name: Compile (debug; every error and slow expression)
        timeout-minutes: 8
        run: |
          set +e
          swift build -Xswiftc -Xfrontend -Xswiftc -warn-long-expression-type-checking=150 \
                      -Xswiftc -Xfrontend -Xswiftc -warn-long-function-bodies=300 2>&1 \
            | tee /tmp/build.log \
            | grep --line-buffered -E "error:|took [0-9]+ms to type-check|Compiling RibbonApp" -A 3
          status=${PIPESTATUS[0]}
          tail -3 /tmp/build.log
          exit $status

      - name: Unit tests (layout engine)
        run: cd Core && swift test 2>&1 | grep -E "Executed|error|failed" | tail -20

      - name: Build universal app
        id: build
        timeout-minutes: 15
        run: VERSION=1.0.0 BUILD=${{ github.run_number }} scripts/build_app.sh 2>&1 | grep -vE "^\[[0-9]+/[0-9]+\]|^[0-9]+%:" | tail -60

      # Ribbon is started straight from this job's shell, so it runs with the runner's own
      # existing Accessibility setup; the tests check and report AXIsProcessTrusted().
      - name: End-to-end tests
        id: e2e
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: python3 e2e/run_e2e.py --app dist/Ribbon.app --fixture .build/universal/RibbonFixture --out dist/e2e

      - name: Package DMG
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cp ~/Library/Logs/Ribbon/ribbon.log dist/e2e/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/Ribbon* dist/e2e/ 2>/dev/null || true
          VERSION=1.0.0 scripts/make_dmg.sh

      - name: Publish build to the ribbon-dist branch
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp dist/*.dmg dist/*.zip /tmp/pub/ 2>/dev/null || true
          cp -R dist/e2e /tmp/pub/e2e 2>/dev/null || true
          cp dist/dmg-background.png /tmp/pub/ 2>/dev/null || true
          cp dist/AppIcon.iconset/icon_512x512.png /tmp/pub/icon.png 2>/dev/null || true
          { echo "commit: $GITHUB_SHA"; echo "run: ${{ github.run_number }}"; echo "e2e: ${{ steps.e2e.outcome }}"; sw_vers; } > /tmp/pub/BUILD_INFO.txt
          cd /tmp/pub
          git init -q
          git checkout -q -b ribbon-dist
          git add -A
          git -c user.name="ribbon-ci" -c user.email="ribbon-ci@users.noreply.github.com" commit -qm "Ribbon build ${GITHUB_SHA::7} (run ${{ github.run_number }}, e2e ${{ steps.e2e.outcome }})"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ribbon-dist

      - name: Fail if the end-to-end tests failed
        if: steps.e2e.outcome == 'failure'
        run: cat dist/e2e/REPORT.md; exit 1
