voice:
  lines:
  - Types of skirts every girl should know!
  - A-line. Fitted at the waist, it flares out like the letter A. Suits every body type.
  - Pencil. Slim and straight. Perfect for office.
  - Pleated. Soft folds that dance when you walk.
  - Wrap. It wraps around, and ties at the side.
  - Mini. Short, fun, and full of attitude.
  - Midi. It stops between the knee and the ankle. Classy, every day.
  - Maxi. Long, flowing, and so comfortable.
  - Tiered. Layer upon layer of boho fun.
  - Mermaid. Fitted, then flares at the bottom. Hello, party!
  - And our desi favourite... the lehenga skirt! Made for shaadi season.
  - So, which one are you wearing next? Tell me in the comments!
  style: A cheerful, warm young Indian woman fashion creator with a natural Indian English accent, talking to her Instagram
    followers like a friendly big sister. Bright and upbeat but clear and easy to understand, say each skirt name with a little
    emphasis and a tiny pause after it, and proud and dramatic on the finale.
  ending_text: So many options... so which one is actually right for you? ... Not every skirt suits every body type. To know
    what suits you...
  ending_style: A warm young Indian woman fashion creator with a natural Indian English accent. Start a little overwhelmed
    and playfully confused, like there are too many choices, then pause, and become sincere and caring, as if sharing a secret.
    In the final phrase, say 'To know' clearly as two words, starting with a crisp T, as a statement (not a question), trailing
    off with gentle curiosity.
