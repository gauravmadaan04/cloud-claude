# Template for a new reel. Copy to reels/<name>/reel.yaml, fill in, then:
#   python make_reel.py reels/<name> new     (then check out/still_*.jpg)
#   python make_reel.py reels/<name> build
title: TYPES OF JACKETS                 # auto-shrinks to fit
subtitle: A STYLE GUIDE FOR WOMEN       # or AN INDIAN WEAR GUIDE FOR WOMEN
watermark: divasclub
vo_offset: 0.5
items:                                  # 10 items. First = base look (her look in the hook + the end); last = finale.
- id: denim                             # file names: img/<id>.png, pieces/<id>.png
  label: DENIM                          # shown above her head
  hem: null                             # filled by the `hems` stage; set by hand for white/black/navy items
  prompt: a classic light-blue denim jacket, hip length, worn open over a plain white top, with dark straight jeans and nude flats.
- id: bomber
  label: BOMBER
  hem: null
  prompt: an olive-green bomber jacket with a ribbed collar, cuffs and hem, hip length, worn open over the same white top.
# ... 8 more items ...
finale:
  desc: The timeless one. Sharp, structured and so elegant.   # on-screen text for the finale line
  name_words: [blazer]                  # words of the finale's name to skip when timing the text
layout:                                 # start from the closest existing reel
  outfit_top: 0.232                     # top edge where pieces land (keep below the chin)
  side_h: 320                           # height of the waiting pieces at the sides
  side_y: 1060
  hook_spacing: 560                     # 380 for tall/narrow pieces, ~580 for wide tops
  hook_h: 0.95
  hook_shift: 0.02
  orbit_h: 230
ending:
  pivot_word: your                      # first word of the prime sentence ("not" / "your")
  prime_rows: [[Your, body, shape, decides], [which, jacket, suits, you.]]
  # icons: face_shapes                  # optional: face-shape cards beside her (for face-shape endings)
audio:
  music: assets/music/desi_fusion_120bpm.mp3   # or assets/music/house_117bpm.mp3 (start 19.975)
  music_start: 74.2
  gain_db: 7.0
  limit: 0.72
voice:
  lines:
  - Types of jackets every woman should know!
  - Denim. Casual, cool, and goes with everything.
  - Bomber. Sporty, with ribbed cuffs and hem.
  # ... one line per item; finale: "And the timeless one... the blazer! Sharp, structured, and so elegant."
  style: A cheerful, warm young Indian woman fashion creator with a natural Indian English accent, talking to her Instagram
    followers like a friendly big sister. Bright and upbeat but clear and easy to understand, say each jacket name with a
    little emphasis and a tiny pause after it, and proud and dramatic on the finale.
  ending_text: So many options... so which one is actually right for you? ... Your body shape decides which jacket suits
    you. To know what suits you...
  ending_style: A warm young Indian woman fashion creator with a natural Indian English accent. Start a little overwhelmed and
    playfully confused, like there are too many choices, then pause, and become sincere and caring, as if sharing a secret.
    In the final phrase, say 'To know' clearly as two words, starting with a crisp T, as a statement (not a question),
    trailing off with gentle curiosity.
generation:
  model_image: assets/models/apple_38_north_indian.png
  base_keep: 'Edit this illustration. Keep the woman exactly the same: same face, smile, gold jhumka earrings, thin gold
    bangles, low bun, skin tone, her apple-shaped body with fuller bust and arms and soft rounded tummy, standing pose, arms
    relaxed slightly away from her body, same hand-drawn colour-pencil and marker style, same white paper background, and
    the exact same framing, head position and scale. No bindi on her forehead. Change her outfit to: '
  keep: 'Edit this illustration. Keep the woman exactly the same: same face, smile, gold jhumka earrings, thin gold bangles,
    low bun, skin tone, her apple-shaped body with fuller bust and arms and soft rounded tummy, standing pose, arms relaxed
    slightly away from her body, same hand-drawn colour-pencil and marker style, same white paper background, and the exact
    same framing, head position and scale. No bindi on her forehead. Change ONLY her jacket to: '
  end: ' Tasteful and modest. Nothing covering her face. No text, no letters, no watermark.'
  cutout_prompt: Draw ONLY the jacket this woman is wearing, by itself, as a hand-drawn paper-doll clothing piece, front view,
    upright, same size and proportions as on her body, exactly the same cut, colours and details, in the same colour-pencil
    and marker style, centred on plain white paper with generous empty space. No person, no head, no hands, no skin, no
    hanger, no shadow, no text, no watermark.
  cutout_aspect: '1:1'
