voice:
  lines:
  - Types of suits every Indian girl should know!
  - Straight suit. Simple and elegant. Perfect for office.
  - Patiala. Lots of pleats in the salwar. Pure Punjabi swag!
  - Sharara. Pants that flare out from the knee. So festive!
  - Gharara. Gathered at the knee, then flared. A nawabi classic.
  - Palazzo suit. Wide, flowy pants. Comfy all day.
  - Churidar. Fitted pants that bunch at the ankles.
  - Angrakha. The kurta wraps, and ties at the side.
  - Dhoti suit. Draped dhoti pants. Fusion fun!
  - Afghani. Loose salwar, gathered at the ankles.
  - And the queen of them all... the Anarkali! Flared, and full of grace.
  style: A cheerful, warm young Indian woman fashion creator with a natural Indian English accent, talking to her Instagram
    followers like a friendly big sister. Bright and upbeat but clear and easy to understand, say each suit name with a little
    emphasis and a tiny pause after it, and proud and dramatic on the finale.
  ending_text: So many options... so which one is actually right for you? ... Not every style flatters every body type. To
    know what suits you...
  ending_style: A warm young Indian woman fashion creator with a natural Indian English accent. Start a little overwhelmed
    and playfully confused, like there are too many choices, then pause, and become sincere and caring, as if sharing a secret.
    In the final phrase, say 'To know' clearly as two words, starting with a crisp T, as a statement (not a question), trailing
    off with gentle curiosity.
