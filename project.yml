name: Haven
options:
  bundleIdPrefix: app.haven
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  HavenCore:
    path: Packages/HavenCore
  WhisperCpp:
    path: Packages/WhisperCpp
targets:
  Haven:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: HavenCore
      - package: WhisperCpp
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Haven
        CFBundleDisplayName: Haven
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Made for your Mac. Nothing leaves it."
        NSDesktopFolderUsageDescription: "Haven shows and searches the files on your Desktop. Nothing leaves your Mac."
        NSDocumentsFolderUsageDescription: "Haven shows and searches the files in your Documents folder. Nothing leaves your Mac."
        NSDownloadsFolderUsageDescription: "Haven shows your downloads and groups them by where they came from. Nothing leaves your Mac."
        NSRemovableVolumesUsageDescription: "Haven can show files from drives you add."
        NSNetworkVolumesUsageDescription: "Haven can show files from network folders you add."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.haven.Haven
        PRODUCT_NAME: Haven
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  HavenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HavenTests
    dependencies:
      - target: Haven
      - package: HavenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.haven.HavenTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Haven.app/Contents/MacOS/Haven"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  HavenUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/HavenUITests
    dependencies:
      - target: Haven
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.haven.HavenUITests
        TEST_TARGET_NAME: Haven
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Haven:
    build:
      targets:
        Haven: all
        HavenTests: [test]
        HavenUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: HavenTests
        - name: HavenUITests
    archive:
      config: Release
